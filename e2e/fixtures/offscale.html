<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OFFSCALE FIXTURE</title>
  <style>
    body {
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background: #FFFFFF;
      color: #111111;
      margin: 20px;
    }
    .micro {
      font-size: 6px;
      color: #CCCCCC;
      background: #FFFFFF;
    }
    .rotated-overlap {
      position: relative;
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      transform: rotate(-18deg);
      border: 1px solid #999999;
      padding: 4px;
    }
    .spacer {
      height: 2400px;
    }
    #below-fold-btn {
      display: inline-block;
      width: 240px;
      height: 52px;
      font-size: 20px;
      font-weight: 700;
      background: #111111;
      color: #FFFFFF;
      border: none;
    }
  </style>
</head>
<body>
  <div class="micro">MICRO_TEXT</div>
  <div class="rotated-overlap">OVERLAP_STRESS_ALPHA / OVERLAP_STRESS_BETA</div>
  <div class="spacer"></div>
  <button id="below-fold-btn" type="button">BELOW_FOLD_BTN</button>
</body>
</html>
