name: Helm
options:
  bundleIdPrefix: com.helm
  deploymentTarget:
    macOS: "27.0"
packages:
  Helm:
    path: .
targets:
  Helm:
    type: application
    platform: macOS
    sources:
      - path: Sources/HelmApp
        excludes:
          - "App/**"
          - "Components/**"
          - "Testing/**"
          - "Theme/**"
          - "Views/**"
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icns
        buildPhase: resources
    entitlements:
      path: Helm.entitlements
      properties:
        com.apple.security.virtualization: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helm.app
        SWIFT_VERSION: "6.4"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    dependencies:
      - package: Helm
        product: HelmCore
      - package: Helm
        product: HelmIsolation
      - package: Helm
        product: HelmBrowser
      - package: Helm
        product: HelmAppCore
